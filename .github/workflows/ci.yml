name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile src/codex_radar_mcp.py
      - name: Test
        run: python -m pytest -q
      - name: Check executable scripts
        run: test -x run.sh && test -x healthcheck.sh
      - name: Shell syntax
        run: bash -n run.sh healthcheck.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for obvious credential assignments
        run: |
          ! grep -RInE '(api[_-]?key|secret|password|bearer[[:space:]]+)[[:space:]]*[:=][[:space:]]*["'"']?[A-Za-z0-9_./+=-]{12,}' \
            --exclude-dir=.git --exclude='*.pyc' .
          ! grep -RInE '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            --exclude-dir=.git --exclude='*.pyc' .
